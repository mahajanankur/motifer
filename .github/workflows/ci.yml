name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

jobs:
  test:
    name: Test on Node.js ${{ matrix.node-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu - all supported Node versions
          - os: ubuntu-latest
            node-version: '16'
          - os: ubuntu-latest
            node-version: '18'
          - os: ubuntu-latest
            node-version: '20'
          - os: ubuntu-latest
            node-version: '22'
          # Windows - latest LTS versions
          - os: windows-latest
            node-version: '18'
          - os: windows-latest
            node-version: '20'
          # macOS - only recent versions (12.x and 14.x not available on ARM64)
          - os: macos-latest
            node-version: '18'
          - os: macos-latest
            node-version: '20'
          - os: macos-latest
            node-version: '22'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
      timeout-minutes: 5
    
    - name: Run tests
      run: npm run test:ci
      timeout-minutes: 8
      continue-on-error: false
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}-node${{ matrix.node-version }}
        path: |
          test-results/
          coverage/
        if-no-files-found: ignore

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Verify package can be packed
      run: npm pack --dry-run
    
    - name: Check package.json validity
      run: npm pkg get name version description --json

  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Check for common issues
      run: |
        echo "Checking for common issues..."
        # Check if main entry point exists
        test -f index.js || (echo "Error: index.js not found" && exit 1)
        # Check if package.json is valid JSON
        node -e "require('./package.json')" || (echo "Error: Invalid package.json" && exit 1)
        echo "✓ Basic checks passed"
