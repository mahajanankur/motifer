name: Mark Stale Issues and PRs

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
    - uses: actions/stale@v9
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        stale-issue-message: 'This issue has been automatically marked as stale because it has not had recent activity. It will be closed if no further activity occurs. Thank you for your contributions.'
        stale-pr-message: 'This pull request has been automatically marked as stale because it has not had recent activity. It will be closed if no further activity occurs. Thank you for your contributions.'
        close-issue-message: 'This issue was automatically closed due to inactivity. If you believe this is still relevant, please feel free to reopen it.'
        close-pr-message: 'This pull request was automatically closed due to inactivity. If you believe this is still relevant, please feel free to reopen it.'
        stale-issue-label: 'stale'
        stale-pr-label: 'stale'
        days-before-issue-stale: 60
        days-before-pr-stale: 30
        days-before-issue-close: 7
        days-before-pr-close: 7
        exempt-issue-labels: 'pinned,security,bug,enhancement'
        exempt-pr-labels: 'pinned,security'
        operations-per-run: 30
